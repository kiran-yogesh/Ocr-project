{% extends "base.html" %}

{% block title %}Upload | Chef AI{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center min-vh-75">
    <div class="col-lg-6">
        <div class="glass-card p-4 text-center border-slate">

            {% if error %}
            <div class="alert alert-danger rounded-3 mb-4 py-2 small text-center">
                <i class="fas fa-exclamation-circle me-2"></i>{{ error }}
            </div>
            {% endif %}

            <!-- ── Bill Parser ── -->
            <div id="tab-bill">
                <div class="mb-3">
                    <div class="user-avatar-viva mx-auto mb-3"
                        style="width: 60px; height: 60px; font-size: 1.5rem; background: var(--primary-light); color: var(--primary); border-radius: 15px; display: flex; align-items: center; justify-content: center;">
                        <i class="fas fa-file-invoice-dollar"></i>
                    </div>
                </div>
                <h2 class="fw-800 mb-1" style="font-size: 1.5rem;">OCR Bill Parser</h2>
                <p class="text-muted mb-4 small">Upload your grocery bill for neural parsing and inventory sync.</p>

                <form action="/upload" method="POST" enctype="multipart/form-data">
                    <div class="upload-zone-viva mb-3" onclick="document.getElementById('billInput').click()">
                        <i class="fas fa-cloud-upload-alt fa-2x mb-2 text-dim"></i>
                        <h5 class="fw-bold mb-1" style="font-size: 1.1rem;">Select Bill Image</h5>
                        <p class="small text-muted">Supports JPG, PNG, JPEG</p>
                        <input type="file" name="bill" id="billInput" class="d-none" required
                            accept="image/png, image/jpeg, image/jpg"
                            onchange="updateFileName(this, 'billSelected')">
                    </div>
                    <div id="billSelected" class="mb-3 d-none text-primary small fw-bold"></div>
                    <button type="submit" class="btn-primary-viva w-100 py-2">
                        <i class="fas fa-bolt me-2"></i>Scan Bill
                    </button>
                </form>
            </div>

        </div>
    </div>
</div>

<script>
    function updateFileName(input, targetId) {
        const display = document.getElementById(targetId);
        if (input.files.length > 0) {
            display.textContent = 'Ready: ' + input.files[0].name;
            display.classList.remove('d-none');
        }
    }
</script>

<style>
    .upload-zone-viva {
        border: 2px dashed #e2e8f0;
        border-radius: 20px;
        padding: 2.5rem 1rem;
        cursor: pointer;
        transition: var(--transition);
        background: #f8fafc;
    }

    .upload-zone-viva:hover {
        border-color: var(--primary);
        background: var(--primary-light);
    }

    .x-small { font-size: 0.75rem; }
    .bg-light { background: #f8fafc !important; }
</style>
{% endblock %}
